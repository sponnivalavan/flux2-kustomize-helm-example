apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    source-file: nginx-HelmRelease-resource.yaml
  name: nginx
  namespace: nginx
spec:
  chart:
    spec:
      chart: ""
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: nginx
  interval: 2m0s
  targetNamespace: nginx
  values:
    service:
      type: ClusterIP
